name: build

# Gera os instaladores das três plataformas. O macOS não exige Mac local:
# o runner macos-latest da Actions produz o .dmg.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux (webkit + empacotadores)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar a CLI do Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar
        working-directory: rust
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dub-mixer-${{ matrix.label }}
          path: |
            rust/target/release/bundle/**
          if-no-files-found: error

# Nota: os instaladores saem sem assinatura. No macOS, o primeiro
# duplo clique pode pedir "Abrir mesmo assim" (Ajustes → Privacidade
# e Segurança). No Windows, o SmartScreen mostra o aviso padrão de
# app sem assinatura.
