[package]
name = "dub-mixer"
version = "0.1.0"
edition = "2021"
description = "DUB MIXER Sound System - executavel nativo em Rust"

[dependencies]
# Tauri: reaproveita o index.html como interface
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "dub-mixer"
path = "src/main.rs"
